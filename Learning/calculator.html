<html>

<head>Calculator</head>

<body>

<input id="num1"/>
<input id="num2"/>
<br>
<br>
<button id="addbtn">Add</button>
<button id="subbtn">Subtract</button>
<button id="mulbtn">Multiply</button>
<button id="divbtn">Divide</button>
<button id="modbtn">Mod</button>
<br>
<p id="result"> </p>
</body>

<script>

    document.getElementById("addbtn").onclick=add;
    document.getElementById("subbtn").onclick=subtract;
    document.getElementById("mulbtn").onclick=multiply;
    document.getElementById("divbtn").onclick=divide;
    document.getElementById("modbtn").onclick=mod;

function add()
{
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;
    let res = parseInt(a)+parseInt(b);
    document.getElementById("result").innerHTML=res;
}
function subtract()
{
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;
    let res = parseInt(a)-parseInt(b);
    document.getElementById("result").innerHTML=res;
}
function multiply()
{
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;
    let res = parseInt(a)*parseInt(b);
    document.getElementById("result").innerHTML=res;
}
function divide()
{
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;
    let res = parseInt(a)/parseInt(b);
    document.getElementById("result").innerHTML=res;
}
function mod()
{
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;
    let res = parseInt(a)%parseInt(b);
    document.getElementById("result").innerHTML = res;
}
</script>


</html>
